[package]
name = "native-epilogue-unwind-repro"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0 WITH LLVM-exception"

# Standalone diagnostic: do not add this signal/instrumentation code to CI.
[workspace]

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
wasmtime = { path = "../../crates/wasmtime", default-features = false, features = ["std", "runtime", "cranelift", "winch", "wat"] }
capstone = { version = "=0.14.0", default-features = false, features = ["full", "arch_x86"] }
libc = "=0.2.185"
